[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "docforensiq-api"
version = "0.1.0"
description = "Authentication and workspace foundation for DocForensIQ"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.0",
  "sqlalchemy[asyncio]==2.0.38",
  "asyncpg==0.30.0",
  "aiosqlite==0.21.0",
  "alembic==1.15.1",
  "pydantic[email]==2.10.6",
  "argon2-cffi==23.1.0",
  "PyJWT==2.10.1",
  "python-dotenv==1.0.1",
]

[project.optional-dependencies]
test = ["pytest==8.3.5", "pytest-asyncio==0.25.3", "httpx==0.28.1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
